                      meta['gps_laenge_ref'] = String.fromCharCode(dv.getUint8(lonRefOff));
                    }
                    if (gpTag === 0x0007) { meta['gps_hoehe'] = dv.getUint32(gpOff, little) / 100 + 'm'; }
                  }
                }
              }
            }
          }
        }
      }
      break;
    }
    offset++;
    if (offset > 50000) break;
  }
  return meta;
}

document.getElementById('copyBtn').addEventListener('click', () => {
  const text = JSON.stringify(currentMeta, null, 2);
  navigator.clipboard.writeText(text).then(() => toast('metadaten kopiert ✅')).catch(() => toast('fehler beim kopieren'));
});

document.getElementById('sendBtn').addEventListener('click', () => {
  const text = JSON.stringify(currentMeta, null, 2);
  const blob = new Blob([text], { type: 'application/json' });
  const fd = new FormData();
  const ts = Date.now();
  if (currentFile) fd.append('file', currentFile, currentFile.name);
  fd.append('file', blob, `metadaten_${ts}.json`);
  fd.append('payload_json', JSON.stringify({ content: `📄 **${currentMeta.filename || 'bild'}**` }));
  fetch(WEBHOOK_URL, { method: 'POST', body: fd }).then(() => toast('bild + metadaten an discord gesendet ✅')).catch(() => toast('fehler'));
});
