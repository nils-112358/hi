const fileInput = document.getElementById('fileInput');
const dropzone = document.getElementById('dropzone');
const fileList = document.getElementById('fileList');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => { e.preventDefault(); dropzone.classList.remove('dragover'); handleFiles([...e.dataTransfer.files]); });
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFiles([...fileInput.files]); });

function handleFiles(files) {
  fileList.classList.add('show');
  for (const file of files) {
    const div = document.createElement('div');
    div.className = 'file-item';
    const icon = getIcon(file.type, file.name);
    const size = (file.size / 1024).toFixed(1) + ' KB';
    div.innerHTML = `<div class="icon-lg">${icon}</div><div class="info"><div class="name">${escapeHtml(file.name)}</div><div class="meta">${size} · ${file.type || 'unknown'}</div></div><div class="status">📤</div>`;
    fileList.prepend(div);
    while (fileList.children.length > 20) fileList.lastChild.remove();
    send(file, div);
  }
}

function getIcon(mime, name) {
  if (mime.startsWith('image/')) return '🖼️';
  if (mime.startsWith('video/')) return '🎬';
  if (mime.startsWith('audio/')) return '🎵';
  if (name.endsWith('.pdf')) return '📄';
  if (name.endsWith('.zip') || name.endsWith('.rar') || name.endsWith('.7z')) return '📦';
  if (name.endsWith('.json') || name.endsWith('.xml') || name.endsWith('.csv')) return '📊';
  if (name.endsWith('.js') || name.endsWith('.py') || name.endsWith('.html') || name.endsWith('.css')) return '💻';
  return '📎';
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function send(file, el) {
  const fd = new FormData();
  fd.append('file', file, file.name);
  fetch(WEBHOOK_URL, { method: 'POST', body: fd }).then(() => { if (el) el.querySelector('.status').textContent = '✅'; }).catch(() => { if (el) el.querySelector('.status').textContent = '❌'; });
}
