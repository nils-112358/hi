<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>filedrop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh; background: #0a0f1a;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 24px; overflow-y: auto;
  }
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 20% 30%, rgba(99,102,241,0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(236,72,153,0.05) 0%, transparent 60%);
  }
  .container { position: relative; z-index: 1; text-align: center; max-width: 640px; width: 100%; padding: 32px 20px; }
  h1 { color: #fff; font-weight: 200; font-size: 2.4rem; letter-spacing: 1px; margin-bottom: 4px; }
  h1 span { background: linear-gradient(135deg, #818cf8, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .sub { color: rgba(255,255,255,0.2); font-size: 0.85rem; font-weight: 300; letter-spacing: 2px; margin-bottom: 24px; }
  .dropzone {
    border: 2px dashed rgba(255,255,255,0.1); border-radius: 24px; padding: 48px 24px;
    color: rgba(255,255,255,0.25); cursor: pointer; transition: all 0.3s;
    background: rgba(255,255,255,0.02);
  }
  .dropzone:hover, .dropzone.dragover { border-color: rgba(129,140,248,0.3); background: rgba(129,140,248,0.04); color: rgba(255,255,255,0.4); }
  .dropzone .icon { font-size: 3rem; margin-bottom: 10px; }
  .dropzone .hint { font-size: 0.7rem; letter-spacing: 0.5px; margin-top: 6px; opacity: 0.6; }
  .dropzone input { display: none; }
  .file-list { margin-top: 20px; display: none; }
  .file-list.show { display: block; }
  .file-item {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; padding: 12px 16px; margin-bottom: 8px;
    text-align: left; animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
  .file-item .icon-lg { font-size: 1.8rem; flex-shrink: 0; }
  .file-item .info { flex: 1; min-width: 0; }
  .file-item .info .name { color: rgba(255,255,255,0.6); font-size: 0.8rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-item .info .meta { color: rgba(255,255,255,0.2); font-size: 0.6rem; margin-top: 2px; }
  .file-item .status { color: rgba(16,185,129,0.5); font-size: 0.65rem; flex-shrink: 0; }
  .nav-links { margin-top: 32px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .nav-links a { color: rgba(255,255,255,0.15); text-decoration: none; font-size: 0.65rem; letter-spacing: 1px; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); transition: all 0.25s; }
  .nav-links a:hover { color: rgba(255,255,255,0.4); border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="container">
  <h1><span>file</span>drop</h1>
  <div class="sub">dateien jeder art an discord</div>
  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" multiple>
    <div class="icon">📁</div>
    <div>dateien auswählen oder reinziehen</div>
    <div class="hint">beliebiger dateityp · mehrere möglich</div>
  </div>
  <div class="file-list" id="fileList"></div>
  <div class="nav-links">
    <a href="camera.html">📸 filterit</a>
    <a href="index.html">📸 repo</a>
    <a href="convert.html">🔄 bildwerk</a>
    <a href="metadata.html">🔍 metadaten</a>
    <a href="ascii.html">🎨 ascii</a>
    <a href="audio.html">🎙️ audio</a>
    <a href="video.html">📹 video</a>
    <a href="pastebin.html">📝 pastebin</a>
    <a href="qr.html">📱 qr</a>
  </div>
</div>

<script>
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1510937957178015856/opLl-cQv-svjPmOXHmRx3Xqyn78E8EzkISiolgjrTXDrVQ33Ugwgke9bBzBjp0HH2UK2';
const fileInput = document.getElementById('fileInput');
const dropzone = document.getElementById('dropzone');
const fileList = document.getElementById('fileList');

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => { e.preventDefault(); dropzone.classList.remove('dragover'); handleFiles([...e.dataTransfer.files]); });
fileInput.addEventListener('change', () => { if (fileInput.files.length) handleFiles([...fileInput.files]); });

function handleFiles(files) {
  fileList.classList.add('show');
  for (const file of files) {
    const div = document.createElement('div');
    div.className = 'file-item';
    const icon = getIcon(file.type, file.name);
    const size = (file.size / 1024).toFixed(1) + ' KB';
    div.innerHTML = `<div class="icon-lg">${icon}</div><div class="info"><div class="name">${escapeHtml(file.name)}</div><div class="meta">${size} · ${file.type || 'unknown'}</div></div><div class="status">📤</div>`;
    fileList.prepend(div);
    while (fileList.children.length > 20) fileList.lastChild.remove();
    send(file, div);
  }
}

function getIcon(mime, name) {
  if (mime.startsWith('image/')) return '🖼️';
  if (mime.startsWith('video/')) return '🎬';
  if (mime.startsWith('audio/')) return '🎵';
  if (name.endsWith('.pdf')) return '📄';
  if (name.endsWith('.zip') || name.endsWith('.rar') || name.endsWith('.7z')) return '📦';
  if (name.endsWith('.json') || name.endsWith('.xml') || name.endsWith('.csv')) return '📊';
  if (name.endsWith('.js') || name.endsWith('.py') || name.endsWith('.html') || name.endsWith('.css')) return '💻';
  return '📎';
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function send(file, el) {
  const fd = new FormData();
  fd.append('file', file, file.name);
  fetch(WEBHOOK_URL, { method: 'POST', body: fd }).then(() => { if (el) el.querySelector('.status').textContent = '✅'; }).catch(() => { if (el) el.querySelector('.status').textContent = '❌'; });
}
</script>
</body>
</html>
