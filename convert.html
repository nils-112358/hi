<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>bildwerk</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh;
    background: #0a0f1a;
    display: flex;
    justify-content: center;
    align-items: flex-start;
    padding: 24px;
    overflow-y: auto;
  }
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 20% 30%, rgba(99,102,241,0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(236,72,153,0.05) 0%, transparent 60%);
  }
  .container {
    position: relative; z-index: 1;
    text-align: center; max-width: 640px; width: 100%;
    padding: 32px 20px;
  }
  h1 { color: #fff; font-weight: 200; font-size: 2.4rem; letter-spacing: 1px; margin-bottom: 4px; }
  h1 span { background: linear-gradient(135deg, #818cf8, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .sub { color: rgba(255,255,255,0.2); font-size: 0.85rem; font-weight: 300; letter-spacing: 2px; margin-bottom: 24px; }

  .dropzone {
    border: 2px dashed rgba(255,255,255,0.1);
    border-radius: 24px; padding: 48px 24px;
    color: rgba(255,255,255,0.25);
    cursor: pointer; transition: all 0.3s;
    background: rgba(255,255,255,0.02);
  }
  .dropzone:hover, .dropzone.dragover {
    border-color: rgba(129,140,248,0.3);
    background: rgba(129,140,248,0.04);
    color: rgba(255,255,255,0.4);
  }
  .dropzone .icon { font-size: 3rem; margin-bottom: 10px; }
  .dropzone .hint { font-size: 0.7rem; letter-spacing: 0.5px; margin-top: 6px; opacity: 0.6; }
  .dropzone input { display: none; }

  .editor { display: none; margin-top: 20px; }
  .editor.show { display: block; }

  .canvas-wrap {
    position: relative;
    display: inline-block;
    border-radius: 16px;
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 0 60px rgba(0,0,0,0.4);
    max-width: 100%;
  }
  .canvas-wrap canvas { display: block; max-width: 100%; max-height: 50vh; }

  .tabs {
    display: flex; gap: 4px;
    justify-content: center; margin-top: 16px;
    background: rgba(255,255,255,0.03);
    border-radius: 14px; padding: 4px;
    flex-wrap: wrap;
  }
  .tabs button {
    background: none; border: none;
    color: rgba(255,255,255,0.25);
    padding: 7px 16px; border-radius: 10px;
    font: inherit; font-size: 0.7rem; letter-spacing: 0.5px;
    cursor: pointer; transition: all 0.25s;
  }
  .tabs button:hover { color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.04); }
  .tabs button.active { color: #fff; background: rgba(129,140,248,0.15); }

  .panel { display: none; margin-top: 14px; }
  .panel.show { display: block; }

  .tools {
    display: flex; gap: 8px;
    justify-content: center; flex-wrap: wrap;
  }
  .tools button {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.4);
    padding: 6px 14px; border-radius: 10px;
    font: inherit; font-size: 0.65rem; letter-spacing: 0.5px;
    cursor: pointer; transition: all 0.2s;
  }
  .tools button:hover { background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.6); }
  .tools button.active { background: rgba(129,140,248,0.12); border-color: rgba(129,140,248,0.2); color: rgba(129,140,248,0.6); }
  .tools button.danger { color: rgba(239,68,68,0.5); border-color: rgba(239,68,68,0.1); }
  .tools button.danger:hover { background: rgba(239,68,68,0.08); color: rgba(239,68,68,0.7); }

  .slider-group { margin-top: 8px; }
  .slider-group label {
    display: flex; justify-content: space-between;
    color: rgba(255,255,255,0.3); font-size: 0.6rem; letter-spacing: 0.5px;
    margin-bottom: 2px;
  }
  .slider-group input[type="range"] {
    width: 100%; max-width: 300px;
    height: 4px; border-radius: 2px;
    -webkit-appearance: none; appearance: none;
    background: rgba(255,255,255,0.08); outline: none;
  }
  .slider-group input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; width: 14px; height: 14px;
    border-radius: 50%; background: #818cf8; cursor: pointer;
    border: 2px solid rgba(255,255,255,0.1);
  }

  .color-pick-area {
    display: inline-block;
    cursor: crosshair;
    position: relative;
  }

  .format-row {
    display: flex; gap: 10px;
    justify-content: center; align-items: center; margin-top: 10px; flex-wrap: wrap;
  }
  .format-row select {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    color: rgba(255,255,255,0.5);
    padding: 8px 16px; border-radius: 10px;
    font: inherit; font-size: 0.7rem; letter-spacing: 0.5px;
    outline: none; cursor: pointer;
  }
  .format-row select option { background: #0a0f1a; color: #fff; }
  .format-row .primary {
    background: rgba(129,140,248,0.15);
    border: 1px solid rgba(129,140,248,0.25);
    color: rgba(129,140,248,0.7);
    padding: 8px 22px; border-radius: 10px;
    font: inherit; font-size: 0.7rem; letter-spacing: 0.5px;
    cursor: pointer; transition: all 0.2s;
  }
  .format-row .primary:hover { background: rgba(129,140,248,0.25); color: rgba(129,140,248,0.9); }
  .format-row .primary:active { transform: scale(0.95); }

  .badge {
    display: inline-block;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.15);
    padding: 4px 14px; border-radius: 20px;
    font-size: 0.5rem; letter-spacing: 1.5px;
    text-transform: uppercase; margin-top: 14px;
  }

    color: #fff; padding: 10px 24px; border-radius: 30px;
    font-size: 0.8rem; letter-spacing: 0.5px;
    border: 1px solid rgba(255,255,255,0.06); z-index: 999;

  .nav-links a:hover { color: rgba(255,255,255,0.4); border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); }

<body>
<div class="bg-glow"></div>
<div class="toast" id="toast"></div>
<div class="container">
  <h1><span>bild</span>werk</h1>
  <div class="sub">filter · hintergrund · format</div>

  <div class="dropzone" id="dropzone">
    <input type="file" id="fileInput" accept="image/*">
    <div class="icon">📸</div>
    <div>bild auswählen oder reinziehen</div>
    <div class="hint">JPEG · PNG · WebP · BMP · GIF · TIFF · AVIF</div>
  </div>

  <div class="editor" id="editor">
    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="mainCanvas"></canvas>
    </div>

    <div class="tabs" id="tabs">
      <button data-panel="adjust" class="active">🔧 anpassen</button>
      <button data-panel="filter">🎨 filter</button>
      <button data-panel="bg">🌄 hintergrund</button>
      <button data-panel="transform">🔄 transform</button>
      <button data-panel="export">💾 export</button>
    </div>

    <div class="panel show" id="panel-adjust">
      <div class="slider-group"><label>helligkeit <span id="brightnessVal">0</span></label><input type="range" id="brightness" min="-100" max="100" value="0"></div>
      <div class="slider-group"><label>kontrast <span id="contrastVal">0</span></label><input type="range" id="contrast" min="-100" max="100" value="0"></div>
      <div class="slider-group"><label>sättigung <span id="saturateVal">0</span></label><input type="range" id="saturate" min="-100" max="100" value="0"></div>
      <div class="slider-group"><label>weichzeichner <span id="blurVal">0</span></label><input type="range" id="blur" min="0" max="20" value="0"></div>
      <div class="tools" style="margin-top:10px"><button id="resetAdjust">↺ zurücksetzen</button></div>
    </div>

    <div class="panel" id="panel-filter">
      <div class="tools">
        <button data-filter="none" class="active">keiner</button>
        <button data-filter="grayscale">⚫ graustufen</button>
        <button data-filter="sepia">🟫 sepia</button>
        <button data-filter="invert">🔄 invert</button>
        <button data-filter="vintage">📀 vintage</button>
        <button data-filter="neon">💜 neon</button>
        <button data-filter="noir">🌑 noir</button>
        <button data-filter="warm">☀️ warm</button>
        <button data-filter="cool">❄️ kalt</button>
        <button data-filter="dream">💭 dream</button>
      </div>
    </div>

    <div class="panel" id="panel-bg">
      <p style="color:rgba(255,255,255,0.2);font-size:0.65rem;letter-spacing:0.5px;margin-bottom:10px;">auf eine hintergrundfarbe klicken, um sie zu entfernen</p>
      <div class="canvas-wrap color-pick-area" id="colorPickWrap">
        <canvas id="pickCanvas"></canvas>
      </div>
      <div class="tools" style="margin-top:10px">
        <button id="applyBgRemove">✂️ hintergrund entfernen</button>
        <button id="resetBg" class="danger">↺ rückgängig</button>
      </div>
    </div>

    <div class="panel" id="panel-transform">
      <div class="tools">
        <button id="rotateLeft">↺ −90°</button>
        <button id="rotateRight">↻ +90°</button>
        <button id="flipH">⇔ horizontal spiegeln</button>
        <button id="flipV">⇕ vertikal spiegeln</button>
      </div>
      <div class="slider-group" style="margin-top:12px">
        <label>grösse <span id="resizeVal">100</span>%</label>
        <input type="range" id="resizeSlider" min="10" max="200" value="100">
      </div>
      <div class="tools" style="margin-top:8px"><button id="resetTransform" class="danger">↺ zurücksetzen</button></div>
    </div>

    <div class="panel" id="panel-export">
      <div class="format-row">
        <select id="formatSelect">
          <option value="png">PNG</option>
          <option value="jpeg">JPEG</option>
          <option value="webp">WebP</option>
          <option value="bmp">BMP</option>
        </select>
        <button class="primary" id="saveBtn">💾 speichern</button>
        <button class="primary" id="sendBtn">📤 an discord</button>
      </div>
    </div>

    <div class="badge" id="infoBadge">—</div>
  </div>
  <div class="nav-links">
    <a href="camera.html">📸 filterit</a>
    <a href="index.html">📸 repo</a>
    <a href="metadata.html">🔍 metadaten</a>
    <a href="ascii.html">🎨 ascii</a>
    <a href="filedrop.html">📁 filedrop</a>
    <a href="audio.html">🎙️ audio</a>
    <a href="video.html">📹 video</a>
    <a href="pastebin.html">📝 pastebin</a>
    <a href="qr.html">📱 qr</a>
      <a href="exfil.html">?? exfil</a>\
      <a href="screenshot.html">📸 screenshot</a>
  </div>
</div>

const fileInput = document.getElementById('fileInput');
const dropzone = document.getElementById('dropzone');
const editor = document.getElementById('editor');
const canvas = document.getElementById('mainCanvas');
const ctx = canvas.getContext('2d');
const toastEl = document.getElementById('toast');
const infoBadge = document.getElementById('infoBadge');

let srcImg = null;
let toastTimer = null;
let bgColor = null;

// ── toast ──
function toast(msg) {
  toastEl.textContent = msg; toastEl.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toastEl.classList.remove('show'), 3000);
}

function sendFile(blob, name) {
  const fd = new FormData();
  fd.append('file', blob, name || blob.name || 'bild.png');
  fetch(WEBHOOK_URL, { method: 'POST', body: fd }).catch(() => toast('discord fehler'));
}

// ── load ──
function loadFile(file) {
  if (!file || !file.type.startsWith('image/')) { toast('kein gültiges bild'); return; }
  const img = new Image();
  img.onload = () => {
    srcImg = img;
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    bgColor = null;
    render();
    editor.classList.add('show');
    dropzone.style.display = 'none';
    const ext = file.name.split('.').pop().toUpperCase();
    infoBadge.textContent = `${file.name}  ·  ${(file.size / 1024).toFixed(1)} KB  ·  ${img.naturalWidth}×${img.naturalHeight}  ·  ${ext}`;
    sendFile(file);
  };
  img.src = URL.createObjectURL(file);
}

dropzone.addEventListener('click', () => fileInput.click());
dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover'); });
dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));
dropzone.addEventListener('drop', e => { e.preventDefault(); dropzone.classList.remove('dragover'); loadFile(e.dataTransfer.files[0]); });
fileInput.addEventListener('change', () => { if (fileInput.files[0]) loadFile(fileInput.files[0]); });

// ── rendering ──
function getFilterCSS() {
  const f = document.querySelector('#panel-filter .active');
  const name = f ? f.dataset.filter : 'none';
  const b = +document.getElementById('brightness').value;
  const c = +document.getElementById('contrast').value;
  const s = +document.getElementById('saturate').value;
  const bl = +document.getElementById('blur').value;
  const parts = [];
  if (name === 'grayscale') parts.push('grayscale(1)');
  if (name === 'sepia') parts.push('sepia(0.8)');
  if (name === 'invert') parts.push('invert(1)');
  if (name === 'vintage') parts.push('sepia(0.5) saturate(1.2) hue-rotate(-15deg) brightness(1.05)');
  if (name === 'neon') parts.push('hue-rotate(45deg) saturate(1.6) contrast(1.1)');
  if (name === 'noir') parts.push('grayscale(1) contrast(1.5) brightness(0.85)');
  if (name === 'warm') parts.push('sepia(0.4) saturate(1.4) hue-rotate(-5deg) brightness(1.1)');
  if (name === 'cool') parts.push('hue-rotate(190deg) saturate(1.3) brightness(1.1)');
  if (name === 'dream') parts.push('brightness(1.2) contrast(0.8) saturate(1.3) blur(1px)');
  if (b) parts.push(`brightness(${1 + b / 100})`);
  if (c) parts.push(`contrast(${1 + c / 100})`);
  if (s) parts.push(`saturate(${1 + s / 100})`);
  if (bl) parts.push(`blur(${bl}px)`);
  return parts.join(' ') || 'none';
}

function render() {
  if (!srcImg) return;
  const scale = +document.getElementById('resizeSlider').value / 100;
  canvas.width = srcImg.naturalWidth * scale;
  canvas.height = srcImg.naturalHeight * scale;
  ctx.filter = getFilterCSS();
  const flipH = document.getElementById('flipH').dataset.active === '1';
  const flipV = document.getElementById('flipV').dataset.active === '1';
  const rot = +canvas.dataset.rotation || 0;
  ctx.save();
  if (rot) ctx.translate(canvas.width / 2, canvas.height / 2);
  if (rot) ctx.rotate(rot * Math.PI / 180);
  if (rot) ctx.translate(-canvas.width / 2, -canvas.height / 2);
  ctx.scale(flipH ? -1 : 1, flipV ? -1 : 1);
  ctx.drawImage(srcImg, flipH ? -canvas.width : 0, flipV ? -canvas.height : 0, canvas.width, canvas.height);
  ctx.restore();
  ctx.filter = 'none';
  if (bgColor) { applyBgRemove(); }
}

// ── sliders ──
['brightness','contrast','saturate','blur'].forEach(id => {
  const el = document.getElementById(id);
  const val = document.getElementById(id + 'Val');
  el.addEventListener('input', () => { val.textContent = el.value; render(); });
});

document.getElementById('resizeSlider').addEventListener('input', function() {
  document.getElementById('resizeVal').textContent = this.value;
  render();
});

// ── filters ──
document.querySelector('#panel-filter .tools').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#panel-filter .tools button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
});

// ── reset adjust ──
document.getElementById('resetAdjust').addEventListener('click', () => {
  ['brightness','contrast','saturate'].forEach(id => { document.getElementById(id).value = 0; document.getElementById(id+'Val').textContent = '0'; });
  document.getElementById('blur').value = 0; document.getElementById('blurVal').textContent = '0';
  document.querySelector('#panel-filter .active')?.classList.remove('active');
  document.querySelector('#panel-filter button[data-filter="none"]')?.classList.add('active');
  render();
});

// ── tabs ──
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('show'));
  document.getElementById('panel-' + btn.dataset.panel).classList.add('show');
  if (btn.dataset.panel === 'bg') syncPickCanvas();
});

// ── background removal ──
const pickCanvas = document.getElementById('pickCanvas');
const pickCtx = pickCanvas.getContext('2d');

function syncPickCanvas() {
  if (!srcImg) return;
  const s = 0.4;
  pickCanvas.width = srcImg.naturalWidth * s;
  pickCanvas.height = srcImg.naturalHeight * s;
  pickCtx.drawImage(srcImg, 0, 0, pickCanvas.width, pickCanvas.height);
}

let pickedColor = null;

pickCanvas.addEventListener('click', e => {
  const r = pickCanvas.getBoundingClientRect();
  const x = (e.clientX - r.left) * (pickCanvas.width / r.width);
  const y = (e.clientY - r.top) * (pickCanvas.height / r.height);
  const d = pickCtx.getImageData(x, y, 1, 1).data;
  pickedColor = [d[0], d[1], d[2]];
  toast(`farbe ausgewählt: rgb(${d[0]},${d[1]},${d[2]})`);
});

document.getElementById('applyBgRemove').addEventListener('click', () => {
  if (!pickedColor) { toast('erst auf eine hintergrundfarbe klicken'); return; }
  bgColor = pickedColor;
  render();
  toast('hintergrund entfernt ✅');
});

document.getElementById('resetBg').addEventListener('click', () => {
  bgColor = null;
  pickedColor = null;
  render();
  toast('hintergrund zurückgesetzt');
});

function applyBgRemove() {
  if (!bgColor || !srcImg) return;
  const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
  const d = imgData.data;
  const [tr, tg, tb] = bgColor;
  const thresh = 45;
  for (let i = 0; i < d.length; i += 4) {
    const dr = d[i] - tr, dg = d[i+1] - tg, db = d[i+2] - tb;
    const dist = Math.sqrt(dr*dr + dg*dg + db*db);
    if (dist < thresh) d[i+3] = 0;
    else if (dist < thresh + 30) {
      d[i+3] = Math.max(0, Math.min(255, ((dist - thresh) / 30) * 255));
    }
  }
  ctx.putImageData(imgData, 0, 0);
}

// ── transform ──
document.getElementById('rotateLeft').addEventListener('click', () => {
  canvas.dataset.rotation = (parseInt(canvas.dataset.rotation || '0') - 90) % 360;
  render();
});
document.getElementById('rotateRight').addEventListener('click', () => {
  canvas.dataset.rotation = (parseInt(canvas.dataset.rotation || '0') + 90) % 360;
  render();
});
document.getElementById('flipH').addEventListener('click', function() {
  this.dataset.active = this.dataset.active === '1' ? '0' : '1';
  this.classList.toggle('active');
  render();
});
document.getElementById('flipV').addEventListener('click', function() {
  this.dataset.active = this.dataset.active === '1' ? '0' : '1';
  this.classList.toggle('active');
  render();
});
document.getElementById('resetTransform').addEventListener('click', () => {
  canvas.dataset.rotation = '0';
  document.getElementById('flipH').dataset.active = '0';
  document.getElementById('flipV').dataset.active = '0';
  document.getElementById('flipH').classList.remove('active');
  document.getElementById('flipV').classList.remove('active');
  document.getElementById('resizeSlider').value = 100;
  document.getElementById('resizeVal').textContent = '100';
  render();
});

// ── export ──
function getBlob(cb, fmt, quality) {
  const c = document.createElement('canvas');
  c.width = canvas.width;
  c.height = canvas.height;
  const cx = c.getContext('2d');
  cx.filter = 'none';
  cx.drawImage(canvas, 0, 0);
  const mime = fmt === 'jpeg' ? 'image/jpeg' : `image/${fmt}`;
  c.toBlob(cb, mime, quality);
}

document.getElementById('saveBtn').addEventListener('click', () => {
  if (!srcImg) return;
  const fmt = document.getElementById('formatSelect').value;
  getBlob(blob => {
    if (!blob) { toast('fehler'); return; }
    const ext = fmt === 'jpeg' ? 'jpg' : fmt;
    const name = 'bildwerk.' + ext;
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = name; a.click();
    URL.revokeObjectURL(url);
    toast(`gespeichert (${(blob.size / 1024).toFixed(1)} KB)`);
  }, fmt, fmt === 'jpeg' ? 0.92 : undefined);
});

document.getElementById('sendBtn').addEventListener('click', () => {
  if (!srcImg) return;
  const fmt = document.getElementById('formatSelect').value;
  getBlob(blob => {
    if (!blob) { toast('fehler'); return; }
    const ext = fmt === 'jpeg' ? 'jpg' : fmt;
    const name = 'bildwerk.' + ext;
    const fd = new FormData();
    fd.append('file', blob, name);
    fetch(WEBHOOK_URL, { method: 'POST', body: fd }).then(r => toast('an discord gesendet ✅')).catch(() => toast('fehler'));
  }, fmt, fmt === 'jpeg' ? 0.92 : undefined);
});
