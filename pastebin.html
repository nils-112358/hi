const textInput = document.getElementById('textInput');
const charCount = document.getElementById('charCount');
const statusEl = document.getElementById('status');
const pastes = document.getElementById('pastes');

let debounceTimer = null;
let lastText = '';

textInput.addEventListener('input', () => {
  const len = textInput.value.length;
  charCount.textContent = `${len} zeichen`;
  clearTimeout(debounceTimer);
  if (len === 0 || textInput.value === lastText) return;
  debounceTimer = setTimeout(() => {
    const text = textInput.value;
    if (!text.trim() || text === lastText) return;
    lastText = text;
    send(text);
  }, 2000);
});

function send(text) {
  const ts = Date.now();
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const fd = new FormData();
  const name = `paste_${ts}.txt`;
  fd.append('file', blob, name);
  const preview = text.length > 80 ? text.slice(0, 80) + '…' : text;
  fd.append('payload_json', JSON.stringify({ content: `📝 **${name}**\n\`\`\`\n${preview}\n\`\`\`` }));
  fetch(WEBHOOK_URL, { method: 'POST', body: fd });
  pastes.classList.add('show');
  const div = document.createElement('div');
  div.className = 'paste-item';
  const now = new Date(ts).toLocaleTimeString();
  div.innerHTML = `<div class="preview">${escapeHtml(preview)}</div><div class="meta">${text.length} B · ${now}</div><div class="status">✅</div>`;
  pastes.prepend(div);
  while (pastes.children.length > 20) pastes.lastChild.remove();
  statusEl.textContent = `gesendet · ${preview}`;
  setTimeout(() => { statusEl.textContent = ''; }, 3000);
}

function escapeHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
